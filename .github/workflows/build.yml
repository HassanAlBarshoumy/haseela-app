name: Build Windows EXE (Nuitka)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka

      - name: Generate bundled changelog snapshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force resources | Out-Null
          $headers = @{
            "Accept" = "application/vnd.github+json"
            "User-Agent" = "Haseela-Build"
          }
          $resp = Invoke-RestMethod -Uri "https://api.github.com/repos/HassanAlBarshoumy/haseela-app/releases?per_page=100" -Headers $headers
          $json = $resp | ConvertTo-Json -Depth 8
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "resources/changelog.json"), $json, [System.Text.UTF8Encoding]::new($false))
          if (-not (Test-Path "resources/changelog.json")) {
            Write-Error "changelog snapshot was not generated"
            exit 1
          }

      # Mirrors the local build script, with two CI-specific differences:
      # bin/ is not tracked in the repository (optional activation companion,
      # the app degrades gracefully without it), and resources/ is included
      # so the built EXE ships all flashcard and game content banks.
      - name: Build standalone EXE with Nuitka
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --windows-disable-console `
            --assume-yes-for-downloads `
            --enable-plugin=pyside6 `
            --include-data-dir=locales=locales `
            --include-data-dir=lib=lib `
            --include-data-dir=bin=bin `
            --include-data-dir=resources=resources `
            --include-data-file=dictionary.db=dictionary.db `
            --include-data-file=NOTICE.dictionary.txt=NOTICE.dictionary.txt `
            --include-package-data=vosk `
            --include-package-data=sherpa_onnx `
            --include-package=onnxruntime `
            --include-package-data=onnxruntime `
            --include-package-data=numpy `
            --include-module=sounddevice `
            --include-package-data=_sounddevice_data `
            --include-package=certifi `
            --include-package-data=certifi `
            --include-package=websockets `
            --include-package-data=websockets `
            --include-package=edge_tts `
            --include-package-data=edge_tts `
            --include-package=aiohttp `
            --include-package-data=aiohttp `
            --include-package=multidict `
            --include-package=yarl `
            --include-package=frozenlist `
            --include-package=propcache `
            --include-package=aiosignal `
            --include-package=comtypes `
            --include-package-data=comtypes `
            --include-package=winrt `
            --include-package-data=winrt `
            --include-package=deep_translator `
            --include-package-data=deep_translator `
            --include-package=bs4 `
            --include-package-data=bs4 `
            --include-package=soupsieve `
            --include-package-data=soupsieve `
            --include-package=win32com `
            --include-package-data=win32com `
            --include-package=win32comext `
            --include-package-data=win32comext `
            --include-module=pythoncom `
            --include-module=pywintypes `
            --output-filename="haseela.exe" `
            --output-dir=dist `
            main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Nuitka intentionally skips DLLs inside --include-data-dir targets
      # (it treats them as code), so the screen-reader helper DLLs that
      # UniversalSpeechEngine loads at runtime are copied in explicitly.
      # The same rule strips executables, hence HaseelaActivate.exe too.
      - name: Copy native helpers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/main.dist/lib/UniversalSpeech | Out-Null
          Copy-Item lib/UniversalSpeech/* dist/main.dist/lib/UniversalSpeech/ -Force
          New-Item -ItemType Directory -Force dist/main.dist/bin | Out-Null
          if (Test-Path bin/HaseelaActivate.exe) {
            Copy-Item bin/HaseelaActivate.exe dist/main.dist/bin/HaseelaActivate.exe -Force
          } else {
            Write-Warning "bin/HaseelaActivate.exe not found; activation will be disabled in this build."
          }
          $pywinSys32 = "venv/Lib/site-packages/pywin32_system32"
          foreach ($pat in @("pythoncom*.dll", "pywintypes*.dll")) {
            $found = @(Get-ChildItem -Path $pywinSys32 -Filter $pat -ErrorAction SilentlyContinue)
            if ($found.Count -eq 0) {
              Write-Warning "Missing pywin32 runtime DLL pattern: $pywinSys32/$pat"
              continue
            }
            foreach ($f in $found) {
              Copy-Item $f.FullName (Join-Path "dist/main.dist" $f.Name) -Force
            }
          }

      - name: Verify build output
        shell: pwsh
        run: |
          $required = @(
            "dist/main.dist/haseela.exe",
            "dist/main.dist/dictionary.db",
            "dist/main.dist/NOTICE.dictionary.txt",
            "dist/main.dist/sherpa_onnx",
            "dist/main.dist/resources",
            "dist/main.dist/resources/changelog.json",
            "dist/main.dist/bin/HaseelaActivate.exe",
            "dist/main.dist/lib/UniversalSpeech/UniversalSpeech.dll",
            "dist/main.dist/lib/UniversalSpeech/nvdaControllerClient.dll"
          )
          $pywinDlls = @(Get-ChildItem "dist/main.dist/pythoncom*.dll","dist/main.dist/pywintypes*.dll" -ErrorAction SilentlyContinue)
          if ($pywinDlls.Count -lt 2) {
            Write-Error "Missing pywin32 runtime DLLs in bundle (pythoncom*.dll/pywintypes*.dll)"
            exit 1
          }
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              Write-Error "Missing from bundle: $f"
              exit 1
            }
          }
          Get-ChildItem dist/main.dist | Select-Object Name, Length

      - name: Smoke test critical bundle modules
        shell: pwsh
        run: |
          $bundle = "dist/main.dist"
          $exe = Join-Path $bundle "haseela.exe"
          $requiredModules = @(
            "edge_tts", "aiohttp", "websockets", "certifi", "comtypes",
            "winrt", "win32com", "win32comext", "deep_translator", "bs4", "soupsieve"
          )
          $missing = @()
          foreach ($mod in $requiredModules) {
            $dirPath = Join-Path $bundle $mod
            $hasDir = Test-Path $dirPath
            $hasFile = @(Get-ChildItem -Path $bundle -Filter "$mod*" -File -ErrorAction SilentlyContinue | Select-Object -First 1).Count -gt 0
            $hasNested = @(Get-ChildItem -Path $bundle -Recurse -Filter "${mod}*" -File -ErrorAction SilentlyContinue | Select-Object -First 1).Count -gt 0
            $hasInExe = (Test-Path $exe) -and (Select-String -Path $exe -Pattern $mod -SimpleMatch -Quiet)
            if (-not ($hasDir -or $hasFile -or $hasNested -or $hasInExe)) {
              $missing += $mod
            }
          }
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Error "Missing bundled module: $_" }
            exit 1
          }
          Write-Host "smoke-ok"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe not found after chocolatey install"
            exit 1
          }
          & $iscc haseela.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "installer/haseela-setup.exe")) {
            Write-Error "installer was not produced"
            exit 1
          }

      - name: Zip portable distribution folder
        shell: pwsh
        run: Compress-Archive -Path dist/main.dist/* -DestinationPath haseela-windows-portable.zip -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: haseela-installer
          path: installer/haseela-setup.exe
          retention-days: 14

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: haseela-portable
          path: haseela-windows-portable.zip
          retention-days: 14

      - name: Attach builds to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "installer/haseela-setup.exe" `
            "haseela-windows-portable.zip" `
            --title "Haseela $env:GITHUB_REF_NAME" `
            --generate-notes
