name: Build Haseela installer

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Optional private-source ref (branch, tag or commit SHA) to build.
          Defaults to the default branch (main) of the private repo.
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      # Source stays private; this token only needs read access to it.
      # fetch-depth: 0 pulls full history so the release-notes generator
      # (later in this workflow) can classify commits since the last release.
      # The private repo never holds tags (pushing one there would burn
      # paid Actions minutes), so the default ref is its main branch.
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: HassanAlBarshoumy/haseela
          token: ${{ secrets.CI_PAT }}
          ref: ${{ inputs.ref || 'main' }}
          path: src
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt
          python -m pip install nuitka

      - name: Restore Nuitka cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Build standalone EXE with Nuitka
        working-directory: src
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --windows-disable-console `
            --assume-yes-for-downloads `
            --include-data-dir=locales=locales `
            --include-data-dir=lib=lib `
            --include-data-dir=bin=bin `
            --include-data-dir=resources=resources `
            --include-data-file=dictionary.db=dictionary.db `
            --include-package-data=vosk `
            --output-filename="haseela.exe" `
            --output-dir=dist `
            main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Nuitka intentionally skips DLLs and executables inside its data dirs
      # (it treats them as code), so the screen-reader helper DLLs that
      # UniversalSpeechEngine loads at runtime are copied in explicitly.
      # The same rule strips executables, hence HaseelaActivate.exe too.
      - name: Copy native helpers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src/dist/main.dist/lib/UniversalSpeech | Out-Null
          Copy-Item src/lib/UniversalSpeech/* src/dist/main.dist/lib/UniversalSpeech/ -Force
          New-Item -ItemType Directory -Force src/dist/main.dist/bin | Out-Null
          Copy-Item src/bin/HaseelaActivate.exe src/dist/main.dist/bin/HaseelaActivate.exe -Force

      - name: Verify build output
        shell: pwsh
        run: |
          $required = @(
            "src/dist/main.dist/haseela.exe",
            "src/dist/main.dist/dictionary.db",
            "src/dist/main.dist/resources",
            "src/dist/main.dist/bin/HaseelaActivate.exe",
            "src/dist/main.dist/lib/UniversalSpeech/UniversalSpeech.dll",
            "src/dist/main.dist/lib/UniversalSpeech/nvdaControllerClient.dll"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              Write-Error "Missing from bundle: $f"
              exit 1
            }
          }
          Get-ChildItem src/dist/main.dist | Select-Object Name, Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe not found after chocolatey install"
            exit 1
          }
          & $iscc src/haseela.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "src/installer/haseela-setup.exe")) {
            Write-Error "installer was not produced"
            exit 1
          }

      - name: Zip portable distribution folder
        shell: pwsh
        run: Compress-Archive -Path src/dist/main.dist/* -DestinationPath haseela-windows-portable.zip -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: haseela-installer
          path: src/installer/haseela-setup.exe
          retention-days: 14

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: haseela-portable
          path: haseela-windows-portable.zip
          retention-days: 14

      # Build release notes from the SOURCE repo's actual commits (the public
      # repo is only a build surface and holds no source). The private repo is
      # never tagged (BUILD.md), so a boundary can never be a private tag name.
      # Strategy mirrors the versioning SOP: map each prior public release tag
      # to the source commit that bumped APP_VERSION to that version (git log
      # -G/-S on gui_constants.py). Fallbacks are clearly labelled so the notes
      # scope is never silently misread.
      - name: Generate release notes from source
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $cur = "$env:GITHUB_REF_NAME"
          if ($cur -like 'refs/tags/*') { $cur = $cur -replace '^refs/tags/','' }

          $rawReleases = (gh release list --repo "$env:GITHUB_REPOSITORY" --limit 20 --json tagName,publishedAt) 2>$null
          $all = if ($rawReleases) { $rawReleases | ConvertFrom-Json } else { @() }
          $prevRel = $all | Where-Object { $_.tagName -ne $cur } | Select-Object -First 1

          # Fail fast: never fall back to a wide "last N commits" spill. If the
          # prior release cannot be determined or mapped to a source commit,
          # abort so misleading release notes are never published.
          if ($null -eq $prevRel -or $prevRel.tagName -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Host "::error::Could not determine the previous release to diff against (got tagName='$($prevRel.tagName)'). Aborting release-note generation."
            exit 1
          }
          $prevVer = $Matches[0]

          # Map the prior version to the source commit that bumped APP_VERSION.
          $prevShaLine = git -C src log --reverse -S $prevVer --oneline -- gui_constants.py 2>$null | Select-Object -First 1
          if (-not $prevShaLine) {
            Write-Host "::error::Found prior release $($prevRel.tagName) but no source commit bumps APP_VERSION to $prevVer in gui_constants.py. Aborting to avoid a wrong commit range."
            exit 1
          }
          $prevSha = ($prevShaLine -split ' ')[0]
          $range = "$prevSha..HEAD"
          $label = "التغييرات منذ الإصدار $($prevRel.tagName) (التزام المصدر $prevSha)"

          $log = @(git -C src log --oneline $range 2>$null)
          if ($log.Count -eq 0) {
            Write-Host "::error::No commits found in range '$range' for $cur. Aborting to avoid publishing empty notes."
            exit 1
          }

          $feat = @(); $fix = @(); $docs = @(); $other = @()
          foreach ($line in $log) {
            $subj = ($line -replace '^\S+\s+', '').Trim()
            if ($subj -match '^feat') { $feat += $subj }
            elseif ($subj -match '^fix') { $fix += $subj }
            elseif ($subj -match '^docs') { $docs += $subj }
            else { $other += $subj }
          }

          $out = @("> $label")
          if ($feat.Count) { $out += ""; $out += "## ميزات جديدة"; $out += $feat }
          if ($fix.Count)  { $out += ""; $out += "## إصلاحات";     $out += $fix }
          if ($docs.Count) { $out += ""; $out += "## توثيق";       $out += $docs }
          if ($other.Count){ $out += ""; $out += "## أخرى";        $out += $other }
          $prevTag = if ($prevRel) { $prevRel.tagName } else { '' }
          $out += ""
          $out += "التغييرات الكاملة: https://github.com/$env:GITHUB_REPOSITORY/compare/$prevTag...$cur"
          ($out -join "`n") | Set-Content -Path notes.md -Encoding UTF8

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "src/installer/haseela-setup.exe" `
            "haseela-windows-portable.zip" `
            --title "Haseela $env:GITHUB_REF_NAME" `
            --notes-file notes.md `
            --latest
